name: iOS Build & Upload to TestFlight

on:
  # push:           # Uncomment these 3 lines to re-enable automatic TestFlight builds on push to main
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 1.0.4). Leave blank to read it from pubspec.yaml."
        required: false
        default: ""
      build_number:
        description: "Build number — MUST be higher than the last uploaded build. Leave blank to use the run number."
        required: false
        default: ""

jobs:
  build-and-upload-ios:
    name: Build Flutter IPA and upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 3. Code signing ──────────────────────────────────────────────────────
      # Secrets required (set in GitHub repo Settings → Secrets and variables → Actions):
      #   BUILD_CERTIFICATE_BASE64       — base64 of your Distribution .p12 certificate
      #   P12_PASSWORD                   — password for the .p12 file
      #   BUILD_PROVISION_PROFILE_BASE64 — base64 of your App Store provisioning profile (.mobileprovision)
      #   KEYCHAIN_PASSWORD              — any random password; used only for the temp keychain

      - name: Import Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate and allow codesign/xcodebuild to use it
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PP_PLIST=$RUNNER_TEMP/build_pp.plist
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

          # Extract metadata so signing can use the exact profile name/UUID
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PP_PLIST")
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PP_PLIST")
          PP_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PP_PLIST")
          APP_BUNDLE_ID="${PP_APP_ID#*.}"

          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "PP_NAME=$PP_NAME" >> "$GITHUB_ENV"
          echo "APP_BUNDLE_ID=$APP_BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Using provisioning profile '$PP_NAME' ($PP_UUID) for $APP_BUNDLE_ID"

      # ── 4. ExportOptions ─────────────────────────────────────────────────────
      # Tells Xcode to export for App Store Connect distribution.
      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat /tmp/ExportOptions.plist

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build Flutter iOS (unsigned)
        run: |
          # Version name: use the manual input, else the version from pubspec.yaml.
          BUILD_NAME="${{ github.event.inputs.build_name }}"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)"
          fi
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"

          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Archive and export signed IPA
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ../build/ios/ipa

          IPA_PATH=$(find ../build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA file produced."
            exit 1
          fi
          echo "Exported IPA: $IPA_PATH"

      # ── 6. Upload to TestFlight ───────────────────────────────────────────────
      # Secrets required:
      #   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect API key page
      #   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID from App Store Connect API key page
      #   APP_STORE_CONNECT_API_KEY_P8  — base64 of the downloaded .p8 private key file

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # altool looks for the API key in ./private_keys or ~/private_keys
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode -o ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # altool can exit 0 even when Apple rejects the build, so capture the
          # output and fail explicitly on any reported upload error.
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tee "$UPLOAD_LOG"
          ALTOOL_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Failed to upload package|ERROR:" "$UPLOAD_LOG"; then
            echo "::error::TestFlight upload failed. Common cause: the version string is already approved/closed — bump the version (e.g. 1.0.4 → 1.0.5)."
            exit 1
          fi
          echo "Upload accepted. Apple processing takes ~10-30 minutes before the build appears in TestFlight."

      # ── 7. Cleanup ───────────────────────────────────────────────────────────
      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
          rm -f ~/private_keys/AuthKey_*.p8
